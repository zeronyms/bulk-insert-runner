[project]
name = "bulk-insert-runner"
version = "0.1.0"
description = "Universal bulk data insertion runner via cURL, Excel, CSV, and JSON"
requires-python = ">=3.10"
dependencies = [
    "requests>=2.28.0",
    "openpyxl>=3.1.0",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.4.0",
]

[tool.basedpyright]
typeCheckingMode = "standard"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
]
ignore = []

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
